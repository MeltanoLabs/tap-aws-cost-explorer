send_anonymous_usage_stats: true
project_id: "tap-aws-cost-explorer"
default_environment: test
requires_meltano: ">=4.0"
environments:
- name: test
plugins:
  extractors:
  - name: "tap-aws-cost-explorer"
    namespace: "tap_aws_cost_explorer"
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    - structured-logging

    settings:
    - name: access_key
      kind: string
      label: Access Key ID
      description: AWS access key ID. Leave unset to use the default AWS credential chain.
      sensitive: true

    - name: secret_key
      kind: string
      label: Secret Access Key
      description: AWS secret access key for the access key ID.
      sensitive: true

    - name: session_token
      kind: string
      label: Session Token
      description: AWS session token, if the credentials are temporary.
      sensitive: true

    - name: role_arn
      kind: string
      label: Role ARN
      description: IAM role to assume before calling AWS, for example a read-only billing role in the organization's management account.

    - name: start_date
      kind: date_iso8601
      label: Start Date
      description: First day of cost data to extract. Cost Explorer serves the last 14 months.

    - name: end_date
      kind: date_iso8601
      label: End Date
      description: Day to stop at, exclusive. Defaults to today, so data runs to yesterday.

    - name: lookback_days
      kind: integer
      label: Lookback Days
      value: 3
      description: Days before the bookmark to extract again on each run, to pick up revised figures.

    - name: granularity
      kind: options
      label: Granularity
      value: DAILY
      options:
      - label: Daily
        value: DAILY
      - label: Monthly
        value: MONTHLY

    - name: metrics
      kind: array
      label: Metrics
      value: [AmortizedCost, UnblendedCost, NetUnblendedCost, UsageQuantity]
      description: Cost metrics to extract.

    - name: reports
      kind: array
      label: Reports
      description: Extra cost reports, each extracted as its own stream, grouped by up to two dimensions, tags or cost categories.

    settings_group_validation:
    - [start_date]

  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
